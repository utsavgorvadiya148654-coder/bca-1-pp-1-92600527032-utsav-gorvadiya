<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Student Details</h2>

    <!-- Header Row -->
    <div class="row bg-dark text-white p-2">
        <div class="col">ID</div>
        <div class="col">Name</div>
        <div class="col">Course</div>
        <div class="col">Marks</div>
    </div>

    <!-- Row 1 -->
    <div class="row border p-2">
        <div class="col">1</div>
        <div class="col">Utsav</div>
        <div class="col">BCA</div>
        <div class="col">85</div>
    </div>

    <!-- Row 2 -->
    <div class="row border p-2">
        <div class="col">2</div>
        <div class="col">Rahul</div>
        <div class="col">BCA</div>
        <div class="col">78</div>
    </div>

    <!-- Row 3 -->
    <div class="row border p-2">
        <div class="col">3</div>
        <div class="col">devem</div>
        <div class="col">BCA</div>
        <div class="col">92</div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
